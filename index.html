<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="تطبيق مشاوير (Mashaweer) - منصة التوصيل الذكي والنقل">
  <meta name="theme-color" content="#99140B">

  <!-- Preload Splash Logo for instantaneous 0ms display -->
  <link rel="preload" href="logo.png" as="image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mashaweer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Google Sign-In Client ID & Google Identity Services (GIS) SDK -->
  <meta name="google-signin-client_id" content="9129249114-ufibtarq68u1l4epc3lmi2fvlhv12gk0.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- 🚀 التقاط فوري لـ id_token عند عودة المتصفح من جوجل (0ms قبل تفريغ الـ Hash من راوتر فلاتر) -->
  <script>
    (function() {
      try {
        var hash = window.location.hash || '';
        var search = window.location.search || '';
        var raw = '';
        if (hash.indexOf('id_token=') !== -1) {
          raw = hash.substring(1);
        } else if (search.indexOf('id_token=') !== -1) {
          raw = search.substring(1);
        }
        if (raw) {
          var params = new URLSearchParams(raw);
          var idToken = params.get('id_token');
          if (idToken) {
            console.log('🔑 [index.html] Captured Google id_token at 0ms (length: ' + idToken.length + ')');
            try { sessionStorage.setItem('PENDING_GOOGLE_ID_TOKEN', idToken); } catch(e){}
            try { localStorage.setItem('PENDING_GOOGLE_ID_TOKEN', idToken); } catch(e){}
            try { localStorage.setItem('flutter.PENDING_GOOGLE_ID_TOKEN', JSON.stringify(idToken)); } catch(e){}
            window.addEventListener('DOMContentLoaded', function() {
              var m = document.getElementById('splash-auth-msg');
              if (m) m.style.display = 'block';
            });
          }
        }
      } catch (e) {
        console.error('Error saving OAuth token in index.html:', e);
      }
    })();
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>

  <title>Mashaweer - مشاوير</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Almarai & Cairo for Arabic typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Google Maps JavaScript API (loaded with defer so it never blocks the initial splash paint) -->
  <script defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyByl6HHRNJP6KVFuiB-ABmnZhtjWhp1lsQ&libraries=drawing,places,geometry"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
      font-family: 'Almarai', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 🏎️ شاشة البداية الفورية للويب (Native HTML/CSS Splash) */
    #mashaweer-splash-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s;
      pointer-events: all;
    }

    #mashaweer-splash-loader.fade-out {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .splash-logo-box {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-logo-img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      z-index: 2;
      animation: splashLogoPulse 2s ease-in-out infinite;
      filter: drop-shadow(0 8px 24px rgba(153, 20, 11, 0.12));
    }

    /* خطوط السرعة الرياضية (Kinetic Speed Streaks) المتطابقة مع تطبيق الموبايل */
    .speed-streaks {
      position: absolute;
      right: 110px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
      z-index: 1;
      animation: splashStreakRush 1.4s ease-in-out infinite alternate;
    }

    .streak-line {
      border-radius: 2px;
    }

    .streak-line.top {
      width: 44px;
      height: 3.5px;
      background-color: #E52E2E;
    }

    .streak-line.mid {
      width: 78px;
      height: 4.5px;
      background-color: #222222;
    }

    .streak-line.bottom {
      width: 36px;
      height: 3.5px;
      background-color: #E52E2E;
    }

    .splash-title {
      margin-top: 18px;
      font-size: 27px;
      font-weight: 800;
      color: #1A1A1A;
      letter-spacing: -0.4px;
      font-family: 'Almarai', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .splash-subtitle {
      margin-top: 6px;
      font-size: 13.5px;
      font-weight: 400;
      color: #757575;
      font-family: 'Almarai', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* مؤشر شريط التقدم الانسيابي السريع */
    .splash-progress-track {
      margin-top: 32px;
      width: 160px;
      height: 4px;
      background-color: #F0F2F5;
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .splash-progress-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      background: linear-gradient(90deg, #99140B, #E52E2E, #FF5252);
      border-radius: 99px;
      animation: splashIndeterminate 1.5s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
    }

    @keyframes splashIndeterminate {
      0% {
        left: -35%;
        right: 100%;
      }
      60% {
        left: 100%;
        right: -90%;
      }
      100% {
        left: 100%;
        right: -90%;
      }
    }

    @keyframes splashLogoPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
    }

    @keyframes splashStreakRush {
      0% {
        opacity: 0.65;
        transform: translateY(-50%) translateX(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(-50%) translateX(-4px);
      }
    }
  </style>
</head>
<body>
  <!-- 🏎️ شاشة البداية المباشرة (خلفية بيضاء نظيفة بدون أي صورة أيقونة ثابتة) -->
  <div id="mashaweer-splash-loader">
    <div class="splash-container">
      <div id="splash-auth-msg" style="display:none; font-family:'Almarai',sans-serif; font-size:15px; font-weight:bold; color:#222; margin-bottom:16px;">مرحباً بك! جارٍ تأكيد تسجيل الدخول...</div>
      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // وظيفة إخفاء الاسبلاش بنعومة فور جاهزية واجهة التطبيق
    function hideMashaweerSplash() {
      var splash = document.getElementById('mashaweer-splash-loader');
      if (splash && !splash.classList.contains('fade-out')) {
        splash.classList.add('fade-out');
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    }
    window.hideMashaweerSplash = hideMashaweerSplash;

    // مراقبة تحميل محرك فلاتر وإخفاء الاسبلاش بسلاسة فور ظهور أول إطار
    if (window.MutationObserver) {
      var splashObserver = new MutationObserver(function(mutations, obs) {
        var flutterElement = document.querySelector('flutter-view, flt-glass-pane');
        if (flutterElement) {
          setTimeout(hideMashaweerSplash, 120);
          obs.disconnect();
        }
      });
      if (document.body) {
        splashObserver.observe(document.body, { childList: true, subtree: true });
      }
    }

    // صمام أمان لضمان عدم تعليق الشاشة تحت أي ظرف
    setTimeout(hideMashaweerSplash, 12000);
  </script>

  <script src="flutter_bootstrap.js?v=20261101_v8" async></script>
</body>
</html>
